<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Project Name</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        /* Smooth fade-in for page load */
        @keyframes fadeIn {
            from { opacity: 0; }
            to { opacity: 1; }
        }
        .animate-fade-in {
            animation: fadeIn 1.0s ease-out forwards;
        }
    </style>
</head>
<body class="bg-[#0f1115] text-gray-100 min-h-screen font-sans selection:bg-indigo-500 selection:text-white">

    <!-- Wrapper div to capture everything for the fade-in effect -->
    <div class="animate-fade-in min-h-screen flex flex-col justify-between">

        <!-- Navbar -->
        <nav class="max-w-6xl w-full mx-auto px-6 py-6 flex justify-between items-center">
            <div class="text-xl font-bold tracking-wider text-transparent bg-clip-text bg-gradient-to-r from-indigo-400 to-purple-400">
                PROJECT_NAME
            </div>
            <div class="space-x-6 text-sm font-medium text-gray-400">
                <a href="#features" class="hover:text-white transition-colors">Features</a>
                <a href="#about" class="hover:text-white transition-colors">About</a>
            </div>
        </nav>

        <!-- Main Hero Section (removed duplicate animate-fade-in from here) -->
        <main class="max-w-4xl mx-auto px-6 py-20 flex-grow flex flex-col items-center justify-center text-center">
            
            <!-- Optional Subtle Badge -->
            <span class="px-3 py-1 text-xs font-semibold tracking-wide text-indigo-400 bg-indigo-500/10 rounded-full mb-6 border border-indigo-500/20">
                In Active Development
            </span>

            <!-- Main Heading -->
            <h1 class="text-5xl md:text-6xl font-extrabold tracking-tight mb-6 bg-gradient-to-b from-white to-gray-400 bg-clip-text text-transparent">
                Build something incredible.
            </h1>

            <!-- Subheading -->
            <p class="text-lg md:text-xl text-gray-400 max-w-2xl mb-10 leading-relaxed">
                A minimalist, high-performance template tailored for modern projects. Hosted instantly on GitHub Pages with zero friction.
            </p>

            <!-- Call to Action Buttons -->
            <div class="flex flex-col sm:flex-row gap-4 justify-center items-center w-full sm:w-auto">
                
                <!-- Primary Action (e.g., View on GitHub or Download) -->
                <a href="https://github.com" target="_blank" rel="noopener noreferrer" 
                   class="w-full sm:w-auto px-8 py-3.5 bg-white text-black font-semibold rounded-xl hover:bg-gray-200 transition-all shadow-lg hover:shadow-white/5 text-center">
                    Get Started
                </a>

                <!-- Discord Button -->
                <a href="https://discord.gg/YOUR-INVITE-LINK" target="_blank" rel="noopener noreferrer" 
                   class="w-full sm:w-auto inline-flex items-center justify-center gap-3 px-8 py-3.5 bg-[#5865F2] hover:bg-[#4752C4] text-white font-semibold rounded-xl transition-all shadow-lg hover:shadow-[#5865F2]/20 group">
                    <!-- Official Discord SVG Icon -->
                    <svg class="w-5 h-5 fill-current transition-transform group-hover:scale-105" viewBox="0 0 127.14 96.36" xmlns="https://www.w3.org/2000/svg">
                        <path d="M107.7,8.07A105.15,105.15,0,0,0,77.26,0a77.19,77.19,0,0,0-3.3,6.83A96.67,96.67,0,0,0,53.22,6.83,77.19,77.19,0,0,0,50,.08,105.35,105.35,0,0,0,19.47,8.07C3.66,31.58-1.86,54.65,1,77.53A105.73,105.73,0,0,0,32,96.36a74.37,74.37,0,0,0,6.71-11,68.6,68.6,0,0,1-10.57-5.1c.9-.65,1.76-1.34,2.58-2a75.58,75.58,0,0,0,72.9,0c.82.71,1.68,1.4,2.58,2a68.48,68.48,0,0,1-10.57,5.1,75.1,75.1,0,0,0,6.71,11,105.54,105.54,0,0,0,31.1-18.83C130.66,48.22,124.8,25.47,107.7,8.07ZM42.45,65.69C36.18,65.69,31,60,31,53S36.18,40.36,42.45,40.36,53.83,46,53.69,53,48.72,65.69,42.45,65.69Zm42.24,0C78.41,65.69,73.24,60,73.24,53S78.41,40.36,84.69,40.36,96.07,46,95.93,53,91,65.69,84.69,65.69Z"/>
                    </svg>
                    Join our Discord
                </a>

            </div>

        </main>

        <!-- Footer -->
        <footer class="border-t border-gray-900/50 bg-[#0b0c10]/50 backdrop-blur-md py-6 text-center text-xs text-gray-500">
            <div class="max-w-6xl mx-auto px-6 flex flex-col sm:flex-row justify-between items-center gap-4">
                <div>&copy; 2026 Project Name. All rights reserved.</div>
                <div class="flex gap-4">
                    <a href="#" class="hover:text-gray-300 transition-colors">Privacy</a>
                    <a href="#" class="hover:text-gray-300 transition-colors">Terms</a>
                </div>
            </div>
        </footer>

    </div>

</body>
</html>
